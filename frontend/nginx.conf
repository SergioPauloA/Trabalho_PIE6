server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:3333;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
  }
  location = /health {
    proxy_pass http://api:3333;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
