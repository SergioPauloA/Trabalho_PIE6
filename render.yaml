# Publicação no Render (plano gratuito): um serviço web entrega a API e o site, com um PostgreSQL.
# O banco gratuito do Render expira 30 dias após a criação; o serviço hiberna sem acessos
# e leva cerca de um minuto para voltar no primeiro acesso.
databases:
  - name: mercelume-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"

services:
  - type: web
    name: mercelume
    runtime: node
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: >-
      npm ci --include=dev --no-audit --no-fund && npm run db:generate && npm run build
      && cd ../frontend && npm ci --include=dev --no-audit --no-fund && npm run build
    # Migrações e dados demonstrativos (idempotentes) antes de iniciar a API.
    startCommand: >-
      npx prisma migrate deploy && npm run db:seed:catalog && npm run db:seed:olap
      && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: HOST
        value: 0.0.0.0
      - key: STATIC_DIR
        value: ../frontend/dist
      - key: DATABASE_URL
        fromDatabase:
          name: mercelume-db
          property: connectionString
